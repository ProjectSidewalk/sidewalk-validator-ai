name: tests

# pull_request covers every PR; push only for the long-lived branches, so a PR branch does not run twice.
on:
  pull_request:
  push:
    branches: [master, audit-readme-and-fixes]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the CPU tests import; torch/transformers are imported lazily by the GPU code paths.
      - run: >-
          pip install numpy pandas scikit-learn matplotlib pytest pillow opencv-python-headless requests
          "sidewalk-panorama-tools @ git+https://github.com/ProjectSidewalk/sidewalk-panorama-tools@b0c8124e4fbb583c47981cc0150b48de787b5388"
      - run: pytest -q
