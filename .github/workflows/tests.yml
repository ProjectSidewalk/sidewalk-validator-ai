name: tests

# pull_request covers every PR; push only for the long-lived branches, so a PR branch does not run twice.
on:
  pull_request:
  push:
    branches: [master, audit-readme-and-fixes]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the CPU tests import; torch/transformers are imported lazily by the GPU code paths.
      - run: pip install "numpy>=1.24" "pandas>=2.0" "scikit-learn>=1.3" "matplotlib>=3.7" "pytest>=7"
      - run: pytest -q
